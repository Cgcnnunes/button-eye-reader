name: Deploy to PROD

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.validate.outputs.artifact }}
      digest: ${{ steps.validate.outputs.digest }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: validate
        run: node scripts/deployment.ts validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

  production:
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download deployment artifacts
        run: node scripts/deployment.ts download
        env:
          EXPECTED_ARTIFACT: ${{ needs.validate.outputs.artifact }}
          EXPECTED_DIGEST: ${{ needs.validate.outputs.digest }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}

      - name: Apply PROD database migrations
        run: npx wrangler d1 migrations apply DB --remote --env production

      - name: Deploy to PROD
        run: npx wrangler deploy --env production
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-deploy.jsonl

      - name: Smoke test deployment
        run: node scripts/deployment.ts smoke production
        env:
          DEPLOYMENT_OUTPUT: ${{ runner.temp }}/production-deploy.jsonl

      - name: Promote deployment
        run: node scripts/deployment.ts promote
